; 연출 전용 태그다. 런타임 C++이 이름으로 참조하지 않고 Item Definition만
; 가리키므로, 무기가 늘어도 재빌드 없이 여기서 추가한다.
; Cue Notify 에셋은 Burst 같은 Static 계열로 만든다. GameplayCueNotify_Actor는
; 실행마다 액터를 스폰해서 연사 무기에 맞지 않는다.
;
; 반대로 ActionHook, GameplayEvent, Ability, Data, Item.Id 계층은 C++이 심볼로
; 참조하므로 네이티브로 남겨 둔다. 오타가 컴파일 단계에서 잡혀야 한다.
+GameplayTagList=(Tag="GameplayCue.Weapon.AssaultRifle.Fire",DevComment="돌격소총 발사. Source Scope, OnExecuteStart 또는 OnExecute")
+GameplayTagList=(Tag="GameplayCue.Weapon.AssaultRifle.Tracer",DevComment="돌격소총 트레이서와 탄착. Source Scope, OnExecuteStart, Play At Shot End")
+GameplayTagList=(Tag="GameplayCue.Weapon.SniperRifle.Fire",DevComment="저격총 발사. Source Scope, OnExecuteStart 또는 OnExecute")
+GameplayTagList=(Tag="GameplayCue.Weapon.SniperRifle.Tracer",DevComment="저격총 트레이서와 탄착. Source Scope, OnExecuteStart, Play At Shot End")
+GameplayTagList=(Tag="GameplayCue.Weapon.Impact.Default",DevComment="탄착 지점 연출. Target Scope, OnFirstHit")

; 쿨다운 슬롯이다. 같은 태그를 쓰는 Action끼리 쿨다운을 공유한다.
; Single Action의 bAutomatic은 이 쿨다운이 곧 반복 간격이다. 조종하는 머신이
; 같은 값으로 입력을 반복하고 자기 시계로 판정하므로 수치가 하나뿐이다.
; Fire Action은 이 쿨다운을 쓰지 않는다. 발 간격은 Definition의 ShotInterval이다.
+GameplayTagList=(Tag="Cooldown.Weapon.Fire",DevComment="Single Action 무기 발사 간격. bAutomatic이면 이 값이 반복 주기다")
